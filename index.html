<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="AURA AI - Your intelligent AI assistant" />
  <title>AURA AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-logo">✦</div>
          <div>
            <div class="brand-name">AURA AI</div>
            <div class="brand-sub">AI Assistant</div>
          </div>
        </div>

        <button class="icon-btn close-sidebar" id="closeSidebar" aria-label="Close menu">
          ×
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>＋</span>
        <span>New chat</span>
      </button>

      <div class="search-box">
        <span>⌕</span>
        <input
          type="text"
          id="chatSearch"
          placeholder="Search chats..."
          autocomplete="off"
        />
      </div>

      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-bottom">
        <button class="side-action" id="themeBtn">
          <span id="themeIcon">☾</span>
          <span>Theme</span>
        </button>

        <button class="side-action danger" id="clearChatsBtn">
          <span>⌫</span>
          <span>Clear chats</span>
        </button>

        <div class="developer">
          <div class="status-dot"></div>
          <span>AURA AI online</span>
        </div>
      </div>

    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MAIN -->
    <main class="main">

      <!-- HEADER -->
      <header class="topbar">

        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
            ☰
          </button>

          <div class="mobile-brand">
            <span class="mobile-logo">✦</span>
            <span>AURA AI</span>
          </div>
        </div>

        <div class="model-pill">
          <span class="online-dot"></span>
          <span>AURA AI</span>
        </div>

        <button class="icon-btn" id="topNewChat" title="New chat">
          ＋
        </button>
      </header>

      <!-- CONTENT -->
      <section class="content">

        <!-- WELCOME -->
        <div class="welcome" id="welcome">

          <div class="welcome-logo">✦</div>

          <h1>How can I help you?</h1>

          <p>
            Ask anything, upload files, send a photo or talk to AURA AI.
          </p>

          <div class="suggestions">

            <button class="suggestion" data-prompt="Explain this topic in simple words">
              <span>💡</span>
              <div>
                <strong>Explain something</strong>
                <small>Make difficult topics simple</small>
              </div>
            </button>

            <button class="suggestion" data-prompt="Write a professional message for me">
              <span>✍️</span>
              <div>
                <strong>Write something</strong>
                <small>Messages, emails and content</small>
              </div>
            </button>

            <button class="suggestion" data-prompt="Help me debug this code">
              <span>💻</span>
              <div>
                <strong>Code help</strong>
                <small>Debug and improve your code</small>
              </div>
            </button>

            <button class="suggestion" data-prompt="Give me some creative ideas">
              <span>✨</span>
              <div>
                <strong>Brainstorm</strong>
                <small>Ideas and creative thinking</small>
              </div>
            </button>

          </div>
        </div>

        <!-- MESSAGES -->
        <div class="messages" id="messages"></div>

        <!-- TYPING -->
        <div class="typing-row hidden" id="typingRow">
          <div class="avatar assistant-avatar">✦</div>
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

      </section>

      <!-- COMPOSER -->
      <div class="composer-area">

        <div class="attachment-preview hidden" id="attachmentPreview"></div>

        <div class="composer">

          <button
            class="composer-btn"
            id="attachBtn"
            title="Attach file"
            type="button"
          >
            ＋
          </button>

          <input
            id="fileInput"
            type="file"
            hidden
            multiple
            accept="
              image/*,
              application/pdf,
              text/plain,
              text/csv,
              application/json,
              text/html,
              text/xml,
              audio/*,
              video/*,
              .md
            "
          />

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message AURA AI..."
            autocomplete="off"
          ></textarea>

          <button
            class="composer-btn mic-btn"
            id="micBtn"
            title="Voice message"
            type="button"
          >
            🎙
          </button>

          <button
            class="send-btn"
            id="sendBtn"
            title="Send"
            type="button"
          >
            ↑
          </button>

          <button
            class="send-btn stop-btn hidden"
            id="stopBtn"
            title="Stop"
            type="button"
          >
            ■
          </button>

        </div>

        <div class="composer-footer">
          <span>AI can make mistakes. Check important information.</span>

          <button id="voiceModeBtn" class="voice-mode">
            🔊 Voice mode: Off
          </button>
        </div>

      </div>

    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
