<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
    media="(prefers-color-scheme: light)"
  >

  <meta
    name="theme-color"
    content="#0b0b0d"
    media="(prefers-color-scheme: dark)"
  >

  <meta
    name="description"
    content="AURA AI — Premium AI Assistant"
  >

  <title>AURA AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-top">

        <div class="brand">
          <div class="brand-logo">A</div>

          <div class="brand-name">
            AURA AI
          </div>
        </div>

      </div>


      <button
        id="newChatBtn"
        class="new-chat-btn"
        type="button"
      >
        + New Chat
      </button>


      <div class="history">

        <div class="history-title">
          Chats
        </div>

        <div
          id="historyList"
          class="history-list"
        ></div>

      </div>


      <div class="sidebar-footer">

        <small>
          Developer: Abhay Singh
        </small>

      </div>

    </aside>


    <!-- Mobile overlay -->

    <div
      id="overlay"
      class="overlay"
      aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">

      <!-- ===================================================
           TOP BAR
           =================================================== -->

      <header class="topbar">

        <div class="topbar-left">

          <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            aria-label="Open menu"
            title="Menu"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h16"></path>
            </svg>
          </button>


          <div class="top-brand">

            <strong>
              AURA AI
            </strong>

            <span class="online-status">
              ● Online
            </span>

          </div>

        </div>


        <div class="topbar-actions">

          <button
            class="icon-btn"
            type="button"
            aria-label="New chat"
            title="New chat"
            onclick="document.getElementById('newChatBtn').click()"
          >
            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>

        </div>

      </header>


      <!-- ===================================================
           CHAT AREA
           =================================================== -->

      <section
        id="chat"
        class="chat"
        aria-live="polite"
      >

        <div
          id="chatInner"
          class="chat-inner"
        >

          <!-- ===============================================
               WELCOME
               =============================================== -->

          <div
            id="welcome"
            class="welcome"
          >

            <div class="welcome-logo">
              A
            </div>


            <h1>
              How can I help you?
            </h1>


            <p>
              Welcome to AURA AI. Ask anything, write code,
              analyze ideas, summarize content, or get help
              with your work.
            </p>


            <div class="suggestions">

              <button
                class="suggestion"
                type="button"
                data-prompt="Explain this topic in simple language"
              >
                Explain something simply
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Write a professional message for me"
              >
                Write a professional message
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Help me write clean and working code"
              >
                Help with coding
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Give me some creative ideas"
              >
                Give me creative ideas
              </button>

            </div>

          </div>

        </div>

      </section>


      <!-- ===================================================
           COMPOSER
           =================================================== -->

      <div class="composer-wrap">

        <form
          id="composer"
          class="composer"
          autocomplete="off"
        >

          <!-- Attachment previews -->

          <div
            id="attachments"
            class="attachments"
          ></div>


          <!-- Message input -->

          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="20000"
            placeholder="Message AURA AI..."
            aria-label="Message AURA AI"
            spellcheck="true"
          ></textarea>


          <!-- Composer buttons -->

          <div class="composer-tools">

            <div class="composer-left">

              <!-- Attachment -->

              <button
                id="attachBtn"
                class="tool-btn"
                type="button"
                title="Attach file"
                aria-label="Attach file"
              >

                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"
                  ></path>
                </svg>

              </button>


              <input
                id="fileInput"
                type="file"
                multiple
                hidden
                accept="image/*,.pdf,.txt,.csv,.json,.md,.doc,.docx,.xls,.xlsx"
              >


              <!-- Voice -->

              <button
                id="voiceBtn"
                class="tool-btn"
                type="button"
                title="Voice input"
                aria-label="Voice input"
              >

                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <rect
                    x="9"
                    y="3"
                    width="6"
                    height="12"
                    rx="3"
                  ></rect>

                  <path
                    d="M5 11a7 7 0 0 0 14 0"
                  ></path>

                  <path
                    d="M12 18v3"
                  ></path>

                  <path
                    d="M8 21h8"
                  ></path>

                </svg>

              </button>

            </div>


            <div class="composer-right">

              <!-- Send / Stop -->

              <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                title="Send message"
                aria-label="Send message"
              >

                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path d="M22 2 11 13"></path>
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>

              </button>

            </div>

          </div>

        </form>


        <div class="disclaimer">
          AURA AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="/app.js" defer></script>

</body>
</html>
