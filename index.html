<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="AURA AI — Premium AI Assistant"
  >

  <meta
    name="theme-color"
    content="#ffffff"
    media="(prefers-color-scheme: light)"
  >

  <meta
    name="theme-color"
    content="#0b0b0d"
    media="(prefers-color-scheme: dark)"
  >

  <title>AURA AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <aside
      id="sidebar"
      class="sidebar"
    >

      <div class="sidebar-header">

        <div class="brand">

          <div class="brand-logo">
            A
          </div>

          <div class="brand-text">
            <strong>AURA AI</strong>
            <span>AI Assistant</span>
          </div>

        </div>

      </div>


      <button
        id="newChatBtn"
        class="new-chat-btn"
        type="button"
      >
        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"></path>
          <path d="M5 12h14"></path>
        </svg>

        <span>New Chat</span>
      </button>


      <!-- Appearance -->

      <div class="appearance">

        <div class="section-title">
          Appearance
        </div>

        <div class="theme-buttons">

          <button
            id="lightThemeBtn"
            class="theme-btn"
            type="button"
          >
            <span>☀️</span>
            <span>Light</span>
          </button>

          <button
            id="darkThemeBtn"
            class="theme-btn"
            type="button"
          >
            <span>🌙</span>
            <span>Dark</span>
          </button>

        </div>

      </div>


      <!-- History -->

      <div class="history">

        <div class="section-title">
          Chat History
        </div>

        <div
          id="historyList"
          class="history-list"
        ></div>

      </div>


      <div class="sidebar-footer">

        <div class="developer">
          Developer: Abhay Singh
        </div>

        <div class="version">
          AURA AI
        </div>

      </div>

    </aside>


    <!-- Mobile overlay -->

    <div
      id="overlay"
      class="overlay"
    ></div>


    <!-- =========================
         MAIN
         ========================= -->

    <main class="main">

      <!-- HEADER -->

      <header class="topbar">

        <div class="topbar-left">

          <!-- Three line menu -->

          <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            aria-label="Open menu"
            title="Menu"
          >

            <svg viewBox="0 0 24 24">
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h16"></path>
            </svg>

          </button>


          <div class="top-brand">

            <strong>
              AURA AI
            </strong>

            <span class="online-status">
              <span class="online-dot"></span>
              Online
            </span>

          </div>

        </div>


        <!-- Right side New Chat -->

        <div class="topbar-actions">

          <button
            id="headerNewChat"
            class="icon-btn"
            type="button"
            aria-label="New Chat"
            title="New Chat"
          >

            <svg viewBox="0 0 24 24">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>

          </button>

        </div>

      </header>


      <!-- =========================
           CHAT AREA
           ========================= -->

      <section
        id="chat"
        class="chat"
        aria-live="polite"
      >

        <div
          id="chatInner"
          class="chat-inner"
        >

          <!-- Welcome -->

          <div
            id="welcome"
            class="welcome"
          >

            <div class="welcome-logo">
              A
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              Welcome to AURA AI. Ask anything, write code,
              analyze ideas, summarize content, or get help
              with your work.
            </p>


            <div class="suggestions">

              <button
                class="suggestion"
                type="button"
                data-prompt="Explain this topic in simple language"
              >
                <span class="suggestion-icon">✦</span>
                <span>Explain something simply</span>
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Write a professional message for me"
              >
                <span class="suggestion-icon">✎</span>
                <span>Write a professional message</span>
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Help me write clean and working code"
              >
                <span class="suggestion-icon">&lt;/&gt;</span>
                <span>Help with coding</span>
              </button>


              <button
                class="suggestion"
                type="button"
                data-prompt="Give me some creative ideas"
              >
                <span class="suggestion-icon">✧</span>
                <span>Give me creative ideas</span>
              </button>

            </div>

          </div>

        </div>

      </section>


      <!-- =========================
           COMPOSER
           ========================= -->

      <div class="composer-wrap">

        <form
          id="composer"
          class="composer"
        >

          <!-- Attachments -->

          <div
            id="attachments"
            class="attachments"
          ></div>


          <!-- Text -->

          <textarea
            id="messageInput"
            name="message"
            rows="1"
            maxlength="20000"
            placeholder="Message AURA AI..."
            aria-label="Message AURA AI"
            autocomplete="off"
            spellcheck="true"
          ></textarea>


          <!-- Bottom controls -->

          <div class="composer-tools">

            <div class="composer-left">

              <!-- Attachment -->

              <button
                id="attachBtn"
                class="tool-btn"
                type="button"
                aria-label="Attach file"
                title="Attach file"
              >

                <svg viewBox="0 0 24 24">
                  <path
                    d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.49-8.48"
                  ></path>
                </svg>

              </button>


              <input
                id="fileInput"
                type="file"
                multiple
                hidden
                accept="image/*,.pdf,.txt,.csv,.json,.md,.doc,.docx,.xls,.xlsx"
              >


              <!-- Microphone -->

              <button
                id="voiceBtn"
                class="tool-btn"
                type="button"
                aria-label="Voice input"
                title="Voice input"
              >

                <svg viewBox="0 0 24 24">
                  <rect
                    x="9"
                    y="3"
                    width="6"
                    height="12"
                    rx="3"
                  ></rect>

                  <path
                    d="M5 11a7 7 0 0 0 14 0"
                  ></path>

                  <path
                    d="M12 18v3"
                  ></path>

                  <path
                    d="M8 21h8"
                  ></path>
                </svg>

              </button>

            </div>


            <div class="composer-right">

              <!-- Send -->

              <button
                id="sendBtn"
                class="send-btn"
                type="submit"
                aria-label="Send message"
                title="Send message"
              >

                <svg
                  class="send-icon"
                  viewBox="0 0 24 24"
                >
                  <path d="M22 2 11 13"></path>
                  <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>

              </button>

            </div>

          </div>

        </form>


        <div class="disclaimer">
          AURA AI can make mistakes. Check important information.
        </div>

      </div>

    </main>

  </div>


  <script src="/app.js" defer></script>

</body>
</html>
