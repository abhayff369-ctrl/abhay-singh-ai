<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="description" content="AURA AI — Premium AI Assistant">
  <title>AURA AI</title>

  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">A</div>
        <div>
          <strong>AURA AI</strong>
          <span>AI Assistant</span>
        </div>
      </div>

      <button class="new-chat" id="newChatBtn">
        <span class="plus">+</span>
        <span>New chat</span>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Search chats">
      </div>

      <div class="history" id="history"></div>

      <div class="sidebar-bottom">
        <button class="side-btn" id="themeBtn">
          <span>◐</span>
          <span>Theme</span>
        </button>

        <button class="side-btn" id="clearBtn">
          <span>⌫</span>
          <span>Clear chats</span>
        </button>

        <div class="developer">
          <span>Developer</span>
          <strong>Abhay Singh</strong>
        </div>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu">
          ☰
        </button>

        <div class="top-title">
          <strong>AURA AI</strong>
          <span id="statusText">Online</span>
        </div>

        <button class="new-top-btn" id="topNewChat">
          + New chat
        </button>
      </header>

      <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
          <div class="aura-orb">
            <div class="orb-core">A</div>
          </div>

          <h1>How can I help you?</h1>
          <p>Ask anything, write code, analyze files, or explore an idea.</p>

          <div class="suggestions">
            <button data-prompt="Explain quantum computing in simple words.">
              <span>✦</span>
              Explain something
            </button>

            <button data-prompt="Write a professional website landing page.">
              <span>⌘</span>
              Write code
            </button>

            <button data-prompt="Give me 5 creative project ideas.">
              <span>✧</span>
              Brainstorm ideas
            </button>

            <button data-prompt="Help me make a study plan.">
              <span>◌</span>
              Make a plan
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>

      </section>

      <div class="composer-wrap">

        <div class="attachment-preview" id="attachmentPreview"></div>

        <form class="composer" id="composer">

          <textarea
            id="messageInput"
            rows="1"
            autocomplete="off"
            placeholder="Message AURA AI..."
            aria-label="Message AURA AI"
          ></textarea>

          <div class="composer-bottom">

            <div class="composer-left">
              <label class="attach-btn" title="Attach files">
                <input id="fileInput" type="file" multiple
                  accept="image/*,.pdf,.txt,.json,.csv,.md,.doc,.docx,.audio/*,.video/*">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m20.5 11.5-7.8 7.8a5 5 0 0 1-7.1-7.1l8.3-8.3a3.5 3.5 0 0 1 5 5l-8.4 8.4a2 2 0 0 1-2.8-2.8l7.6-7.6"></path>
                </svg>
              </label>

              <button type="button" class="tool-btn" id="voiceBtn" title="Voice message">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="3" width="6" height="11" rx="3"></rect>
                  <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"></path>
                </svg>
              </button>
            </div>

            <div class="composer-right">
              <button
                type="submit"
                class="send-btn"
                id="sendBtn"
                disabled
                aria-label="Send message"
                title="Send message"
              >
                <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4.5 4.5 20 12 4.5 19.5 7 13l7-1-7-1z"></path>
                </svg>

                <svg class="stop-icon hidden" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                </svg>
              </button>
            </div>

          </div>
        </form>

        <div class="composer-note">
          AURA AI can make mistakes. Check important information.
        </div>

      </div>

    </main>
  </div>

  <div class="toast" id="toast"></div>
</body>
          </html>
